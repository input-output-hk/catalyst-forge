          - test
          type: string
        repo_id:
          type: string
        retention_class:
          enum:
          - short
          - long
          - permanent
          type: string
      required:
      - purpose
      - retention_class
      type: object
    contracts.TracePageResult:
      properties:
        items:
          items:
            $ref: '#/components/schemas/contracts.TraceResponse'
          type: array
          uniqueItems: false
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      type: object
