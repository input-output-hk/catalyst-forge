        finished_at:
          type: string
        module_versions:
          items:
            $ref: '#/components/schemas/contracts.ModuleVersion'
          type: array
          uniqueItems: false
        oci_digest:
          type: string
        oci_ref:
          type: string
        output_hash:
          type: string
        renderer_version:
          type: string
        signature_verified_at:
          type: string
        signed:
          type: boolean
        status:
          enum:
          - pending
          - running
          - succeeded
          - failed
          type: string
        storage_uri:
          type: string
      type: object
    contracts.RepositoryPageResult:
      properties:
        items:
          items:
            $ref: '#/components/schemas/contracts.RepositoryResponse'
          type: array
          uniqueItems: false
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      type: object
    contracts.RepositoryResponse:
