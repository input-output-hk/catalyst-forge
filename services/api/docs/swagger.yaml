          type: string
        created_at:
          type: string
        created_by:
          type: string
        id:
          type: string
        purpose:
          type: string
        repo_id:
          type: string
        retention_class:
          type: string
        updated_at:
          type: string
      type: object
    handlers.CertificateSigningRequest:
      properties:
        common_name:
          description: CommonName can override the CN in the CSR
          example: user.example.com
          type: string
        csr:
          description: CSR is the PEM-encoded Certificate Signing Request
          example: |-
            -----BEGIN CERTIFICATE REQUEST-----
            ...
          type: string
        sans:
          description: |-
            SANs are additional Subject Alternative Names to include
            These will be validated against user permissions. For client certs, use URI SANs.
          example:
          - example.com
          - '*.example.com'
          items:
            type: string
          type: array
          uniqueItems: false
        ttl:
          description: |-
            TTL is the requested certificate lifetime
            Will be capped by server policy
          example: 24h
          type: string
      required:
      - csr
      type: object
    handlers.CertificateSigningResponse:
      properties:
        certificate:
          description: Certificate is the PEM-encoded signed certificate
          example: |-
            -----BEGIN CERTIFICATE-----
            ...
          type: string
        certificate_chain:
          description: CertificateChain includes intermediate certificates if available
          items:
            type: string
          type: array
          uniqueItems: false
        fingerprint:
          description: Fingerprint is the SHA256 fingerprint of the certificate
          example: sha256:abcdef...
          type: string
        not_after:
          description: NotAfter is when the certificate expires
          example: "2024-01-02T00:00:00Z"
          type: string
        not_before:
          description: NotBefore is when the certificate becomes valid
          example: "2024-01-01T00:00:00Z"
          type: string
        serial_number:
          description: SerialNumber is the certificate's serial number
          example: "123456789"
          type: string
      type: object
    service.DeviceLinkResponse:
      properties:
        device_code:
          type: string
        expires_in:
          type: integer
        interval:
          type: integer
        user_code:
          type: string
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
      type: object
    service.ExchangeResponse:
      properties:
        access_token:
          type: string
        device_id:
          type: string
        expires_in:
          type: integer
        refresh_expires_in:
          type: integer
        refresh_token:
          type: string
        status:
          description: '"authorization_pending", "slow_down", "expired_token"'
          type: string
        user:
          $ref: '#/components/schemas/service.UserInfo'
      type: object
    service.UserInfo:
      properties:
        email:
          type: string
        id:
          type: string
        roles:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
