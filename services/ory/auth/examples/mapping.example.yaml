mappings:
  consent:
    requirements:
      - has(kratos.identity.traits.email)
      - has(kratos.identity.traits.domain)
    id_token:
      email: kratos.identity.traits.email
      domain: lower(kratos.identity.traits.domain)
    access_token:
      ext:
        email: kratos.identity.traits.email
        domain: lower(kratos.identity.traits.domain)

  token_hook:
    requirements:
      - has(jwt.repository)
      - has(jwt.ref)
      - has(jwt.sha)
    access_token:
      ext:
        gh_repository: jwt.repository
        gh_ref: jwt.ref
        gh_sha: jwt.sha
        gh_actor: jwt.actor
        gh_environment: jwt.environment

policy:
  on_error: deny
  merge_strategy: deep
