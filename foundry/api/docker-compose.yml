services:
  api:
    build: .
    image: foundry-api:latest
    container_name: api
    command:
      - run
      - --http-port=5050
      - --public-base-url=http://localhost:5050
      - --invite-ttl=72h
      - --auth-access-ttl=30m
      - --auth-refresh-ttl=720h
      - --auth-stepup-ttl=5m
      - --auth-rp-name=Foundry Platform
      - --auth-require-uv=true
      - --auth-challenge-ttl=5m
      - --auth-refresh-cookie-name=__Host-refresh_token
      - --auth-refresh-cookie-secure=false
      - --auth-rate-enabled=false
      - --auth-jwks-route=true
      - --bootstrap-token=dev-bootstrap-token-change-in-production
      - --auth-rbac-seed-defaults=true
      - --db-host=postgres
      - --db-port=5432
      - --db-user=postgres
      - --db-password=postgres
      - --db-name=foundry
      - --db-sslmode=disable
      - --log-level=debug
      - --log-format=text
    environment:
      DB_PASSWORD: postgres
      DB_USER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "5050:5050"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.certs:/certs:ro
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foundry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foundry"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: on-failure

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@foundry.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5051:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure


volumes:
  postgres-data:
  pgadmin-data:
