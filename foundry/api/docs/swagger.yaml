definitions:
  handlers.AddEventRequest:
    properties:
      message:
        type: string
      name:
        type: string
    required:
    - message
    - name
    type: object
  handlers.BootstrapRequest:
    properties:
      bootstrap_token:
        type: string
      email:
        type: string
    required:
    - bootstrap_token
    - email
    type: object
  handlers.CertificateSigningRequest:
    properties:
      common_name:
        description: CommonName can override the CN in the CSR
        example: user.example.com
        type: string
      csr:
        description: CSR is the PEM-encoded Certificate Signing Request
        example: |-
          -----BEGIN CERTIFICATE REQUEST-----
          ...
        type: string
      sans:
        description: |-
          SANs are additional Subject Alternative Names to include
          These will be validated against user permissions. For client certs, use URI SANs.
        example:
        - example.com
        - '*.example.com'
        items:
          type: string
        type: array
      ttl:
        description: |-
          TTL is the requested certificate lifetime
          Will be capped by server policy
        example: 24h
        type: string
    required:
    - csr
    type: object
  handlers.CertificateSigningResponse:
    properties:
      certificate:
        description: Certificate is the PEM-encoded signed certificate
        example: |-
          -----BEGIN CERTIFICATE-----
          ...
        type: string
      certificate_chain:
        description: CertificateChain includes intermediate certificates if available
        items:
          type: string
        type: array
      fingerprint:
        description: Fingerprint is the SHA256 fingerprint of the certificate
        example: sha256:abcdef...
        type: string
      not_after:
        description: NotAfter is when the certificate expires
        example: "2024-01-02T00:00:00Z"
        type: string
      not_before:
        description: NotBefore is when the certificate becomes valid
        example: "2024-01-01T00:00:00Z"
        type: string
      serial_number:
        description: SerialNumber is the certificate's serial number
        example: "123456789"
        type: string
    type: object
  handlers.CreateAliasRequest:
    properties:
      release_id:
        type: string
    required:
    - release_id
    type: object
  handlers.CreateAuthRequest:
    type: object
  handlers.CreateInviteRequest:
    properties:
      email:
        type: string
      roles:
        items:
          type: string
        type: array
      ttl:
        description: e.g., "72h"
        type: string
    type: object
  handlers.CreateInviteResponse:
    properties:
      id:
        type: integer
      token:
        type: string
    type: object
  handlers.CreateReleaseRequest:
    properties:
      bundle:
        type: string
      project:
        type: string
      project_path:
        type: string
      source_branch:
        type: string
      source_commit:
        type: string
      source_repo:
        type: string
    required:
    - bundle
    - project
    - project_path
    - source_commit
    - source_repo
    type: object
  handlers.DeviceListResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      status:
        type: string
    type: object
  handlers.DeviceLoginInitRequest:
    properties:
      device_id:
        type: string
    required:
    - device_id
    type: object
  handlers.DeviceLoginInitResponse:
    properties:
      alg:
        type: string
      challenge:
        type: string
      device_id:
        type: string
      expires_at:
        type: string
    type: object
  handlers.DeviceLoginRequest:
    properties:
      device_id:
        type: string
      device_proof:
        description: base64url(signature)
        type: string
      timestamp:
        type: integer
    required:
    - device_id
    - device_proof
    - timestamp
    type: object
  handlers.DeviceLoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
      user: {}
    type: object
  handlers.DeviceRegisterRequest:
    properties:
      device_id:
        type: string
      device_name:
        type: string
      device_proof:
        type: string
      public_key_jwk:
        additionalProperties: true
        type: object
      timestamp:
        type: integer
    required:
    - device_id
    - device_name
    - device_proof
    - public_key_jwk
    - timestamp
    type: object
  handlers.DeviceRegisterResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
      user: {}
    type: object
  handlers.DeviceRegistrationInitRequest:
    properties:
      invite_id:
        type: integer
      token:
        type: string
    required:
    - invite_id
    - token
    type: object
  handlers.DeviceRegistrationInitResponse:
    properties:
      alg:
        type: string
      challenge:
        type: string
      device_id:
        type: string
      expires_at:
        type: string
    type: object
  handlers.GithubRepositoryAuthResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      permissions:
        items:
          type: string
        type: array
      repository:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  handlers.UpdateAuthRequest:
    type: object
  handlers.UpdateReleaseRequest:
    properties:
      bundle:
        type: string
      project_path:
        type: string
      source_branch:
        type: string
      source_commit:
        type: string
      source_repo:
        type: string
    type: object
  handlers.ValidateTokenRequest:
    properties:
      audience:
        type: string
      token:
        type: string
    required:
    - token
    type: object
  handlers.ValidateTokenResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user_id:
        type: string
    type: object
  internal_api_handlers_user.Role:
    description: Role represents a role in the system
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      name:
        example: admin
        type: string
      permissions:
        example:
        - user:read
        - user:write
        items:
          type: string
        type: array
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  internal_api_handlers_user.User:
    description: User represents a user in the system
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      email:
        example: user@example.com
        type: string
      id:
        example: 123
        type: integer
      status:
        example: active
        type: string
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
    type: object
  internal_api_handlers_user.UserRole:
    description: UserRole represents a many-to-many relationship between users and
      roles
    properties:
      created_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      id:
        example: 1
        type: integer
      role:
        $ref: '#/definitions/internal_api_handlers_user.Role'
      role_id:
        example: 456
        type: integer
      updated_at:
        example: "2023-01-01T00:00:00Z"
        type: string
      user:
        $ref: '#/definitions/internal_api_handlers_user.User'
      user_id:
        example: 123
        type: integer
    type: object
  internal_models_user.User:
    properties:
      created_at:
        description: Timestamps
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: integer
      status:
        $ref: '#/definitions/user.UserStatus'
      updated_at:
        type: string
      user_ver:
        type: integer
    type: object
  models.DeploymentEvent:
    properties:
      created_at:
        type: string
      deployment_id:
        type: string
      id:
        type: integer
      message:
        type: string
      name:
        type: string
      timestamp:
        type: string
      updated_at:
        type: string
    type: object
  models.DeploymentStatus:
    enum:
    - pending
    - running
    - succeeded
    - failed
    type: string
    x-enum-varnames:
    - DeploymentStatusPending
    - DeploymentStatusRunning
    - DeploymentStatusSucceeded
    - DeploymentStatusFailed
  models.Release:
    properties:
      bundle:
        type: string
      created:
        type: string
      created_at:
        description: Timestamps
        type: string
      deployments:
        description: Relationships
        items:
          $ref: '#/definitions/models.ReleaseDeployment'
        type: array
      id:
        type: string
      project:
        type: string
      project_path:
        type: string
      source_branch:
        type: string
      source_commit:
        type: string
      source_repo:
        type: string
      updated_at:
        type: string
    type: object
  models.ReleaseAlias:
    properties:
      created_at:
        type: string
      name:
        type: string
      release:
        allOf:
        - $ref: '#/definitions/models.Release'
        description: Relationships
      release_id:
        type: string
      updated_at:
        type: string
    type: object
  models.ReleaseDeployment:
    properties:
      attempts:
        type: integer
      created_at:
        description: Timestamps
        type: string
      events:
        items:
          $ref: '#/definitions/models.DeploymentEvent'
        type: array
      id:
        type: string
      reason:
        type: string
      release:
        allOf:
        - $ref: '#/definitions/models.Release'
        description: Relationships
      release_id:
        type: string
      status:
        $ref: '#/definitions/models.DeploymentStatus'
      timestamp:
        type: string
      updated_at:
        type: string
    type: object
  user.CreateRoleRequest:
    properties:
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    required:
    - name
    type: object
  user.CreateUserKeyRequest:
    properties:
      kid:
        type: string
      pubkey_b64:
        type: string
      status:
        type: string
      user_id:
        type: integer
    required:
    - kid
    - pubkey_b64
    - user_id
    type: object
  user.CreateUserRequest:
    properties:
      email:
        type: string
      status:
        type: string
    required:
    - email
    type: object
  user.RegisterUserKeyRequest:
    properties:
      email:
        type: string
      kid:
        type: string
      pubkey_b64:
        type: string
    required:
    - email
    - kid
    - pubkey_b64
    type: object
  user.RegisterUserRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  user.UpdateRoleRequest:
    properties:
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    required:
    - name
    - permissions
    type: object
  user.UpdateUserKeyRequest:
    properties:
      kid:
        type: string
      pubkey_b64:
        type: string
      status:
        type: string
      user_id:
        type: integer
    type: object
  user.UpdateUserRequest:
    properties:
      email:
        type: string
      status:
        type: string
    required:
    - email
    type: object
  user.UserKey:
    properties:
      created_at:
        description: Timestamps
        type: string
      device_id:
        description: Device association (optional)
        type: integer
      id:
        type: integer
      kid:
        type: string
      pubkey_b64:
        type: string
      status:
        $ref: '#/definitions/user.UserKeyStatus'
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/internal_models_user.User'
        description: Relationships
      user_id:
        type: integer
    type: object
  user.UserKeyStatus:
    enum:
    - active
    - inactive
    - revoked
    type: string
    x-enum-varnames:
    - UserKeyStatusActive
    - UserKeyStatusInactive
    - UserKeyStatusRevoked
  user.UserStatus:
    enum:
    - pending
    - active
    - inactive
    type: string
    x-enum-varnames:
    - UserStatusPending
    - UserStatusActive
    - UserStatusInactive
info:
  contact: {}
paths:
  /.well-known/jwks.json:
    get:
      consumes:
      - application/json
      description: Returns the public JSON Web Key Set used to verify access tokens
      produces:
      - application/json
      responses:
        "200":
          description: JWKS
          schema:
            additionalProperties: true
            type: object
      summary: Get JWKS
      tags:
      - auth
  /auth/bootstrap:
    post:
      consumes:
      - application/json
      description: Create an admin invite using the bootstrap token (one-time use)
      parameters:
      - description: Bootstrap request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.BootstrapRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.CreateInviteResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or used token
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties: true
            type: object
      summary: Bootstrap admin account
      tags:
      - auth
  /auth/devices:
    get:
      consumes:
      - application/json
      description: Get list of all devices registered to the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: List of user's devices
          schema:
            items:
              $ref: '#/definitions/handlers.DeviceListResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List user's devices
      tags:
      - auth
      - devices
  /auth/devices/{id}:
    delete:
      consumes:
      - application/json
      description: Revoke a specific device and invalidate all its refresh tokens
      parameters:
      - description: Device ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content - device revoked successfully
        "400":
          description: Invalid device ID
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Device not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete/revoke a device
      tags:
      - auth
      - devices
  /auth/devices/init:
    post:
      consumes:
      - application/json
      description: Initialize device registration flow for invited users, requires
        valid invite token
      parameters:
      - description: Device registration initialization request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.DeviceRegistrationInitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DeviceRegistrationInitResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or expired invite
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties: true
            type: object
      summary: Initialize device registration
      tags:
      - auth
  /auth/devices/login:
    post:
      consumes:
      - application/json
      description: Verify signed challenge with stored device key, mint new refresh
        family and access token
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.DeviceLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DeviceLoginResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid or expired challenge or proof
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties: true
            type: object
      summary: Complete returning-device login
      tags:
      - auth
  /auth/devices/login/init:
    post:
      consumes:
      - application/json
      description: Start sign-in for a device that still holds its device key; issues
        short-lived challenge
      parameters:
      - description: Login init request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.DeviceLoginInitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DeviceLoginInitResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Device not found or inactive
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties: true
            type: object
      summary: Initialize returning-device login
      tags:
      - auth
  /auth/devices/register:
    post:
      consumes:
      - application/json
      description: Complete device registration by providing device proof over challenge
      parameters:
      - description: Device registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.DeviceRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DeviceRegisterResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid proof or expired challenge
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties: true
            type: object
      summary: Complete device registration
      tags:
      - auth
  /auth/github:
    get:
      consumes:
      - application/json
      description: Get all GitHub Actions authentication configurations
      produces:
      - application/json
      responses:
        "200":
          description: List of authentication configurations
          schema:
            items:
              $ref: '#/definitions/handlers.GithubRepositoryAuthResponse'
            type: array
        "401":
          description: Authentication required
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List GHA authentication configurations
      tags:
      - gha
    post:
      consumes:
      - application/json
      description: Create a new GitHub Actions authentication configuration for a
        repository
      parameters:
      - description: GHA authentication configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAuthRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Authentication configuration created
          schema:
            $ref: '#/definitions/handlers.GithubRepositoryAuthResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Authentication required
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create GHA authentication configuration
      tags:
      - gha
  /auth/github/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a GitHub Actions authentication configuration
      parameters:
      - description: Authentication configuration ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Authentication configuration deleted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid ID parameter
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Authentication required
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete GHA authentication configuration
      tags:
      - gha
    get:
      consumes:
      - application/json
      description: Get a specific GitHub Actions authentication configuration by its
        ID
      parameters:
      - description: Authentication configuration ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Authentication configuration
          schema:
            $ref: '#/definitions/handlers.GithubRepositoryAuthResponse'
        "400":
          description: Invalid ID parameter
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Authentication required
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Authentication configuration not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get GHA authentication configuration by ID
      tags:
      - gha
    put:
      consumes:
      - application/json
      description: Update an existing GitHub Actions authentication configuration
      parameters:
      - description: Authentication configuration ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated GHA authentication configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateAuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Authentication configuration updated
          schema:
            $ref: '#/definitions/handlers.GithubRepositoryAuthResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Authentication required
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Authentication configuration not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update GHA authentication configuration
      tags:
      - gha
  /auth/github/login:
    post:
      consumes:
      - application/json
      description: Validate a GitHub Actions OIDC token and return a JWT token
      parameters:
      - description: Token validation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ValidateTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token validated successfully
          schema:
            $ref: '#/definitions/handlers.ValidateTokenResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Invalid token
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Repository not authorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties: true
            type: object
      summary: Validate GitHub Actions token
      tags:
      - gha
  /auth/github/repository/{repository}:
    get:
      consumes:
      - application/json
      description: Get a GitHub Actions authentication configuration by repository
        name
      parameters:
      - description: Repository name
        in: path
        name: repository
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Authentication configuration
          schema:
            $ref: '#/definitions/handlers.GithubRepositoryAuthResponse'
        "401":
          description: Authentication required
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Authentication configuration not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get GHA authentication configuration by repository
      tags:
      - gha
  /auth/invites:
    post:
      consumes:
      - application/json
