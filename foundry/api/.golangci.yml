version: 2

run:
  timeout: 5m
  allow-parallel-runners: true
  tests: true

issues:
  exclude-use-default: false
  exclude-rules:
    # Allow dot-imports in tests only (revive's dot-imports rule is enabled).
    - path: _test\.go$
      linters:
        - revive
      text: "dot-imports"
    # Allow long lines in generated files (if any lll is enabled in the future).
    - path: ".*"
      source: "Code generated by"
      linters:
        - lll

linters:
  disable-all: true
  enable:
    # Core style/tools
    - govet
    - staticcheck
    - ineffassign
    - errcheck
    - unused
    - unparam
    - unconvert
    - prealloc
    - nakedret
    - misspell
    - dupword
    - revive
    # Errors and wrapping
    - errorlint
    - wrapcheck
    # Context usage
    - containedctx
    - contextcheck
    - noctx
    # Comment/documentation style
    - godot
    # Testing best practices
    - paralleltest
    - thelper
    - testifylint
    # Misc safety/quality
    - copyloopvar
    - gocyclo
    - gocritic
    - nolintlint
    - tagliatelle

linters-settings:
  gci:
    sections:
      - Standard
      - Default
      - Prefix(github.com/input-output-hk/catalyst-forge)
    skip-generated: true

  godot:
    scope: all        # enforce periods for all comments, not only exported
    exclude: ''

  revive:
    confidence: 0.8
    severity: warning
    rules:
      - name: exported            # require comments on exported identifiers
      - name: comment-spacings    # proper spacing in doc comments
      - name: receiver-naming
      - name: var-naming
        arguments: ["allowCommonInitialisms"]
      - name: error-naming
      - name: time-naming
      - name: if-return
      - name: context-keys-type
      - name: dot-imports         # no dot imports (tests exempted above)

  gocyclo:
    min-complexity: 20

  nolintlint:
    require-explanation: true
    require-specific: true

  wrapcheck:
    ignoreSigs:
      - errors.New
    ignorePackageGlobs:
      - github.com/pkg/errors

  tagliatelle:
    case:
      json: snake
