log:
  level: info

serve:
  public:
    host: 0.0.0.0
    port: 4444
  admin:
    host: 0.0.0.0
    port: 4445

urls:
  # The external issuer your clients will see (via the Gateway)
  self:
    issuer: https://auth.projectcatalyst.dev/hydra/public
  # Login & consent UIs (behind the Gateway)
  login: https://auth.projectcatalyst.dev/hydra/ui/login
  consent: https://auth.projectcatalyst.dev/hydra/ui/consent
  logout: https://auth.projectcatalyst.dev/hydra/ui/logout
  post_logout_redirect: https://forge.projectcatalyst.dev/

oauth2:
  # Enforce PKCE for public clients; useful for SPA/native
  pkce:
    enforced_for_public_clients: true

strategies:
  scope: exact

ttl:
  access_token: 30m
  id_token: 30m
  refresh_token: 720h
