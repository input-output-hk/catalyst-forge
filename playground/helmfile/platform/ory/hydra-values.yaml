hydra:
  automigration:
    enabled: true

  config:
    dsn: ""
    secrets:
      system:
        - dev-hydra-system-secret-please-change
    log:
      level: info

    serve:
      public:
        host: 0.0.0.0
        port: 4444
      admin:
        host: 0.0.0.0
        port: 4445

    urls:
      self:
        admin: http://hydra-admin:4445
        issuer: https://auth.projectcatalyst.dev/hydra/public
        public: https://auth.projectcatalyst.dev/hydra/public
      login: https://auth.projectcatalyst.dev/api/v1/oauth2/login
      consent: https://auth.projectcatalyst.dev/api/v1/oauth2/consent
      logout: https://auth.projectcatalyst.dev/hydra/ui/logout
      post_logout_redirect: https://forge.projectcatalyst.dev/

    oauth2:
      token_hook:
        url: https://auth.projectcatalyst.dev/api/v1/hydra/token-hook
      pkce:
        enforced_for_public_clients: true
    strategies:
      access_token: jwt
      scope: exact
    ttl:
      access_token: 1h
      id_token: 30m
      refresh_token: 8h

  deployment:
    extraEnv:
      - name: DSN
        valueFrom:
          secretKeyRef:
            name: hydra-dsn
            key: dsn

  job:
    extraEnv:
      - name: DSN
        valueFrom:
          secretKeyRef:
            name: hydra-dsn
            key: dsn

# DSN env for runtime per chart docs (root-level objects)
deployment:
  extraVolumes:
    - name: mkcert-root-bundle
      configMap:
        name: mkcert-root-bundle
        items:
          - key: ca.crt
            path: ca.crt
  extraVolumeMounts:
    - name: mkcert-root-bundle
      mountPath: /etc/ssl/cert.pem
      subPath: ca.crt
      readOnly: true
  extraEnv:
    - name: SSL_CERT_FILE
      value: /etc/ssl/cert.pem
    - name: DSN
      valueFrom:
        secretKeyRef:
          name: hydra-dsn
          key: dsn

job:
  extraEnv:
    - name: DSN
      valueFrom:
        secretKeyRef:
          name: hydra-dsn
          key: dsn

cronjob:
  cleanup:
    extraEnv:
      - name: DSN
        valueFrom:
          secretKeyRef:
            name: hydra-dsn
            key: dsn
