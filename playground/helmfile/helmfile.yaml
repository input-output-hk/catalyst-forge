repositories:
  - name: jetstack
    url: https://charts.jetstack.io
  - name: cert-manager
    url: https://charts.jetstack.io
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: twuni
    url: https://helm.twun.io
  - name: localstack
    url: https://localstack.github.io/helm-charts
  - name: external-secrets
    url: https://charts.external-secrets.io
  - name: jouve
    url: https://jouve.github.io/charts/
  - name: ory
    url: https://k8s.ory.sh/helm/charts
  - name: temporalio
    url: https://temporalio.github.io/helm-charts

helmDefaults:
  wait: true
  timeout: 600

releases:
  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.15.3
    createNamespace: true
    values:
      - installCRDs: true
    hooks:
      - events: ["postsync"]
        command: kubectl
        args:
          [
            "wait",
            "--for=condition=Available",
            "--timeout=180s",
            "-n",
            "cert-manager",
            "deployment/cert-manager",
            "deployment/cert-manager-cainjector",
            "deployment/cert-manager-webhook",
          ]
        showlogs: true
      - events: ["postsync"]
        command: sh
        args:
          - -c
          - |
            set -euo pipefail
            CAROOT="$(mkcert -CAROOT)"
            kubectl -n cert-manager create secret tls mkcert-root-ca \
              --cert="$CAROOT/rootCA.pem" \
              --key="$CAROOT/rootCA-key.pem" \
              --dry-run=client -o yaml | kubectl apply -f -
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/cert-manager/cluster-issuer.yaml"]
        showlogs: true
      - events: ["postsync"]
        command: sh
        args:
          - -c
          - |
            set -euo pipefail
            kubectl create namespace envoy-gateway-system --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f platform/cert-manager/wildcard-dev-certificate.yaml
        showlogs: true

  - name: trust-manager
    namespace: cert-manager
    chart: cert-manager/trust-manager
    version: v0.13.0
    createNamespace: false
    needs:
      - cert-manager/cert-manager
    values:
      - app:
          webhook:
            tls:
              helmCert:
                enabled: true
    hooks:
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/trust/bundle-mkcert.yaml"]
        showlogs: true

  - name: envoy-gateway
    namespace: envoy-gateway-system
    chart: oci://docker.io/envoyproxy/gateway-helm
    version: v1.5.0
    createNamespace: true
    needs:
      - cert-manager/cert-manager
    hooks:
      - events: ["postsync"]
        command: kubectl
        args:
          [
            "wait",
            "--for=condition=Available",
            "--timeout=180s",
            "-n",
            "envoy-gateway-system",
            "deployment/envoy-gateway",
          ]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/envoy/gatewayclass.yaml"]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/envoy/gateway.yaml"]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/mock-oidc/namespace.yaml"]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/mock-oidc/deployment.yaml"]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/mock-oidc/service.yaml"]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/envoy/mock-oidc-route.yaml"]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args:
          [
            "-n",
            "mock-oidc",
            "rollout",
            "status",
            "deployment/mock-oidc",
            "--timeout=180s",
          ]
        showlogs: true

  - name: registry
    namespace: registry
    chart: twuni/docker-registry
    version: 2.2.3
    createNamespace: true
    needs:
      - envoy-gateway-system/envoy-gateway
    values:
      - service:
          type: ClusterIP
      - persistence:
          enabled: true
          size: 20Gi
      - ingress:
          enabled: false
    hooks:
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/cert-manager/buildkit-certificate.yaml"]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args:
          [
            "-n",
            "registry",
            "wait",
            "--for=condition=Ready",
            "--timeout=180s",
            "certificate/buildkit-server",
          ]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args:
          [
            "wait",
            "--for=condition=Available",
            "--timeout=180s",
            "-n",
            "registry",
            "deployment/registry-docker-registry",
          ]
        showlogs: true
      - events: ["postsync"]
        command: sh
        args:
          - -c
          - |
            set -euo pipefail
            kubectl apply -f platform/envoy/registry-route.yaml
      - events: ["postsync"]
        command: sh
        args:
          - -c
          - |
            set -euo pipefail
            # Deploy Earthly remote runner (buildkitd)
            kubectl apply -f platform/earthly/buildkitd-pvc.yaml
            kubectl apply -f platform/earthly/buildkitd-deployment.yaml
            kubectl apply -f platform/earthly/buildkitd-service.yaml
            kubectl -n registry rollout status deploy/earthly-buildkitd --timeout=180s
            # Expose buildkitd via TCPRoute on Gateway
            kubectl apply -f platform/envoy/buildkitd-tcproute.yaml
        showlogs: true

  - name: localstack
    namespace: localstack
    chart: localstack/localstack
    createNamespace: true
    values:
      - service:
          type: ClusterIP
    hooks:
      - events: ["postsync"]
        command: kubectl
        args:
          [
            "wait",
            "--for=condition=Available",
            "--timeout=180s",
            "-n",
            "localstack",
            "deployment/localstack",
          ]
        showlogs: true

  - name: external-secrets
    namespace: external-secrets
    chart: external-secrets/external-secrets
    version: 0.11.0
    createNamespace: true
    needs:
      - localstack/localstack
    values:
      - installCRDs: true
      - extraEnv:
          - name: AWS_SECRETSMANAGER_ENDPOINT
            value: "http://localstack.localstack.svc.cluster.local:4566"
          - name: AWS_SSM_ENDPOINT
            value: "http://localstack.localstack.svc.cluster.local:4566"
          - name: AWS_STS_ENDPOINT
            value: "http://localstack.localstack.svc.cluster.local:4566"
    hooks:
      - events: ["postsync"]
        command: kubectl
        args:
          [
            "wait",
            "--for=condition=Available",
            "--timeout=180s",
            "-n",
            "external-secrets",
            "deployment/external-secrets",
          ]
        showlogs: true
      - events: ["postsync"]
        command: sh
        args:
          - -c
          - |
            set -euo pipefail
            # Create/Update credentials Secret for ESO AWS provider (LocalStack)
            kubectl -n external-secrets create secret generic localstack-aws-creds \
              --from-literal=access-key-id="${AWS_ACCESS_KEY_ID:-test}" \
              --from-literal=secret-access-key="${AWS_SECRET_ACCESS_KEY:-test}" \
              --dry-run=client -o yaml | kubectl apply -f -
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/eso/cluster-secret-store.yaml"]
        showlogs: true

  - name: postgres
    namespace: postgres
    chart: oci://registry-1.docker.io/bitnamicharts/postgresql
    version: 16.7.26
    createNamespace: true
    needs:
      - envoy-gateway-system/envoy-gateway
    values:
      - auth:
          username: postgres
          password: postgres
          database: postgres
      - primary:
          persistence:
            enabled: true
            size: 20Gi
    hooks:
      - events: ["postsync"]
        command: kubectl
        args:
          [
            "-n",
            "postgres",
            "rollout",
            "status",
            "statefulset/postgres-postgresql",
            "--timeout=300s",
          ]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/envoy/postgres-tcproute.yaml"]
        showlogs: true

  - name: mailpit
    namespace: mailpit
    chart: jouve/mailpit
    version: 0.28.0
    createNamespace: true
    needs:
      - envoy-gateway-system/envoy-gateway
    values:
      - service:
          type: ClusterIP
          http:
            name: http
          smtp:
            name: smtp
        ingress:
          enabled: false
    hooks:
      - events: ["postsync"]
        command: kubectl
        args:
          [
            "-n",
            "mailpit",
            "rollout",
            "status",
            "deployment/mailpit",
            "--timeout=180s",
          ]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/envoy/mailpit-route.yaml"]
        showlogs: true

  - name: kratos
    namespace: auth
    chart: ory/kratos
    createNamespace: true
    needs:
      - external-secrets/external-secrets
      - postgres/postgres
      - envoy-gateway-system/envoy-gateway
    values:
      - platform/ory/kratos-values.yaml
    hooks:
      - events: ["presync"]
        command: sh
        args:
          - -c
          - |
            set -euo pipefail
            kubectl create namespace auth --dry-run=client -o yaml | kubectl apply -f -
        showlogs: true
      - events: ["presync"]
        command: kubectl
        args: ["apply", "-f", "platform/ory/kratos-mappers.yaml"]
        showlogs: true
      - events: ["presync"]
        command: kubectl
        args: ["apply", "-f", "platform/eso/kratos-external-secrets.yaml"]
        showlogs: true
      - events: ["presync"]
        command: sh
        args:
          - -c
          - |
            set -euo pipefail
            # Wait for ExternalSecret to sync and Secret to exist
            for i in $(seq 1 60); do
              if kubectl -n auth get secret kratos-dsn >/dev/null 2>&1; then exit 0; fi; sleep 2; done; exit 1
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/envoy/kratos-route.yaml"]
        showlogs: true

  - name: hydra
    namespace: auth
    chart: ory/hydra
    createNamespace: false
    needs:
      - external-secrets/external-secrets
      - postgres/postgres
      - envoy-gateway-system/envoy-gateway
    values:
      - platform/ory/hydra-values.yaml
    hooks:
      - events: ["presync"]
        command: sh
        args:
          - -c
          - |
            set -euo pipefail
            kubectl create namespace auth --dry-run=client -o yaml | kubectl apply -f -
        showlogs: true
      - events: ["presync"]
        command: kubectl
        args: ["apply", "-f", "platform/eso/hydra-external-secrets.yaml"]
        showlogs: true
      - events: ["presync"]
        command: sh
        args:
          - -c
          - |
            set -euo pipefail
            for i in $(seq 1 60); do
              if kubectl -n auth get secret hydra-dsn >/dev/null 2>&1; then exit 0; fi; sleep 2; done; exit 1
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/envoy/hydra-routes.yaml"]
        showlogs: true
      - events: ["postsync"]
        command: sh
        args:
          - -c
          - |
            set -euo pipefail
            # Wait for hydra admin to be ready
            kubectl -n auth rollout status deploy/hydra --timeout=180s
            # Port-forward admin locally and register/update a public PKCE client for CLI
            pf_pid=""
            cleanup() { if [ -n "$pf_pid" ]; then kill "$pf_pid" || true; fi }
            trap cleanup EXIT
            kubectl -n auth port-forward svc/hydra-admin 8445:4445 >/dev/null 2>&1 & pf_pid=$!
            for i in $(seq 1 30); do if curl -sk https://127.0.0.1:8445/health/ready >/dev/null; then break; fi; sleep 1; done
            # Upsert client using Hydra admin API
            cat > /tmp/forge-cli.json <<'JSON'
            {
              "client_id": "forge-cli",
              "client_name": "Forge CLI (dev)",
              "token_endpoint_auth_method": "none",
              "grant_types": ["authorization_code", "refresh_token"],
              "response_types": ["code"],
              "scope": "openid offline",
              "redirect_uris": [
                "http://127.0.0.1:49152/callback",
                "http://127.0.0.1:34567/callback"
              ],
              "post_logout_redirect_uris": [
                "http://127.0.0.1:49152/logout"
              ],
              "token_endpoint_auth_signing_alg": "RS256",
              "backchannel_logout_session_required": false,
              "frontchannel_logout_session_required": false
            }
            JSON
            # Try create, else update
            if ! curl -sk -X POST "https://127.0.0.1:8445/admin/clients" -H 'content-type: application/json' --data-binary @/tmp/forge-cli.json; then
              curl -sk -X PUT "https://127.0.0.1:8445/admin/clients/forge-cli" -H 'content-type: application/json' --data-binary @/tmp/forge-cli.json
            fi
            echo "Registered/updated Hydra OAuth2 client 'forge-cli'"
        showlogs: true

  - name: temporal
    namespace: temporal
    chart: temporalio/temporal
    version: 0.65.0
    createNamespace: true
    needs:
      - external-secrets/external-secrets
      - postgres/postgres
      - envoy-gateway-system/envoy-gateway
    values:
      - platform/temporal/values.yaml
    hooks:
      - events: ["presync"]
        command: sh
        args:
          - -c
          - |
            set -euo pipefail
            kubectl create namespace temporal --dry-run=client -o yaml | kubectl apply -f -
      - events: ["presync"]
        command: kubectl
        args: ["apply", "-f", "platform/eso/temporal-external-secrets.yaml"]
        showlogs: true
      - events: ["presync"]
        command: sh
        args:
          - -c
          - |
            set -euo pipefail
            for i in $(seq 1 60); do
              if kubectl -n temporal get secret temporal-default-store >/dev/null 2>&1 && kubectl -n temporal get secret temporal-visibility-store >/dev/null 2>&1; then exit 0; fi; sleep 2; done; exit 1
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args: ["apply", "-f", "platform/envoy/temporal-ui-route.yaml"]
        showlogs: true
      - events: ["postsync"]
        command: kubectl
        args:
          [
            "-n",
            "temporal",
            "rollout",
            "status",
            "deployment/temporal-frontend",
            "--timeout=300s",
          ]
        showlogs: true
