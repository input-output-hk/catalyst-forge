[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playground-cli"
version = "0.1.0"
description = "CLI for managing the Playground v2 local k3d environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.3",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.0",
    "kubernetes>=28.0.0",
    "psycopg[binary]>=3.1.0",
    "requests>=2.31.0",
    "networkx>=3.0",
    "rich>=13.8.0",
]

[project.scripts]
cli = "cli.main:app"

[tool.setuptools.packages.find]
include = ["cli*"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.5.0",
    "black>=24.4.0",
    "pytest>=8.2.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12.12",
    "types-requests>=2.32.4.20250809",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
