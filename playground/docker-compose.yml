services:
  edge:
    profiles: [prod]
    image: caddy:2-alpine
    container_name: edge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.certs:/certs:ro
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started

  api:
    profiles: [dev, prod]
    image: foundry-api:latest
    container_name: api
    command:
      - run
      - --http-port=5050
      - --public-base-url=https://forge.localhost
      - --invite-ttl=72h
      - --auth-access-ttl=30m
      - --auth-refresh-ttl=720h
      - --auth-stepup-ttl=5m
      - --auth-rp-name=Foundry Platform
      - --auth-require-uv=true
      - --auth-challenge-ttl=5m
      - --auth-refresh-cookie-name=__Host-refresh_token
      - --auth-refresh-cookie-secure=false
      - --auth-rate-enabled=false
      - --auth-jwks-route=true
      - --auth-signing-key-path=/run/secrets/jwt_es256.pem
      - --auth-signing-key-kid=dev-1
      - --auth-csrf-secret=${AUTH_CSRF_SECRET}
      - --bootstrap-token=a1b2c3d4e5f60718293a4b5c6d7e8f90
      - --auth-rbac-seed-defaults=true
      - --db-host=postgres
      - --db-port=5432
      - --db-user=postgres
      - --db-password=postgres
      - --db-name=foundry
      - --db-sslmode=disable
      - --log-level=debug
      - --log-format=text
    environment:
      DB_PASSWORD: postgres
      DB_USER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      # Optional: fallback inline PEM if no secret file is mounted
      # AUTH_SIGNING_KEY_PEM: |
      #   -----BEGIN EC PRIVATE KEY-----
      #   ...
      #   -----END EC PRIVATE KEY-----
      # Provide a stable CSRF secret (base64/hex/raw). In dev we export via .env
      AUTH_CSRF_SECRET: "${AUTH_CSRF_SECRET}"
    ports:
      - "5050:5050"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    secrets:
      - jwt_es256.pem

  frontend:
    profiles: [prod]
    image: foundry-frontend:latest
    container_name: frontend
    environment:
      # Point client base URL at the edge; endpoints use absolute /api/v1 paths
      VITE_API_URL: https://forge.localhost
    # no published port; reached via edge
    depends_on:
      api:
        condition: service_started
    restart: on-failure

  # Live-reload dev server with Vite (bind mounts source)
  frontend-dev:
    profiles: [dev]
    image: node:20-alpine
    container_name: frontend-dev
    working_dir: /work
    command: sh -lc "npm ci --no-fund --no-audit && npm run dev -- --host --port 8080"
    environment:
      # In dev, still talk to the edge so cookies/CSRF match browser origin
      VITE_API_URL: https://forge.localhost
      NODE_ENV: development
    volumes:
      - ../services/frontend:/work
      - ../services/clients/ts:/work/vendor/forge-client-src:ro
      - frontend-node-modules:/work/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      api:
        condition: service_started
    restart: on-failure

  # Edge proxy for dev profile that targets the Vite dev server
  edge-dev:
    profiles: [dev]
    image: caddy:2-alpine
    container_name: edge-dev
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./.certs:/certs:ro
    depends_on:
      api:
        condition: service_started
      frontend-dev:
        condition: service_started

  postgres:
    profiles: [dev, prod]
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foundry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foundry"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: on-failure

  pgadmin:
    profiles: [dev, prod]
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@foundry.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5051:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres-data:
  pgadmin-data:
  frontend-node-modules:

secrets:
  jwt_es256.pem:
    file: ./.secrets/jwt_es256.pem


