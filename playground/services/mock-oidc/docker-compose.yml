services:
  mock-oidc:
    image: mock-oidc:latest
    # Use image entrypoint (/app/mock-oidc)
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: "/config/mock-oidc.yaml"
    volumes:
      - ./mock-oidc.config.example.yaml:/config/mock-oidc.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

